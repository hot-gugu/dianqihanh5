<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平台入口 · 合肥市电气焊安全监管服务平台</title>
  <style>
    :root { --ink: #172033; --blue: #0879ff; --pale: #eef6ff; --line: #d8e5f4; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: radial-gradient(ellipse at 85% 0, #e4f0ff, transparent 55%), #f5f8fc; font: 14px/1.65 "Microsoft YaHei", "PingFang SC", sans-serif; }
    main { width: min(1120px, 100% - 48px); margin-inline: auto; padding-block: clamp(32px, 7vw, 84px) 48px; }
    h1, h2, p { margin: 0; }
    h1 { max-width: 20em; font-size: clamp(27px, 4.6vw, 54px); line-height: 1.2; letter-spacing: -.045em; font-weight: 600; text-wrap: balance; }
    h1 span { display: block; font-size: .38em; letter-spacing: .05em; margin-bottom: 8px; color: #526b91; font-weight: 400; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    .featured { display: grid; grid-template-columns: 1.8fr 1fr; gap: 16px; margin-top: 32px; }
    .feature { position: relative; min-height: 282px; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; padding: 26px; border-radius: 20px; transition: box-shadow .2s, transform .2s; }
    .feature:hover { transform: translateY(-3px); box-shadow: 0 14px 32px #17203324; }
    .dashboard { color: white; background: linear-gradient(135deg, #172033, #173c6b); }
    .dashboard img { position: absolute; z-index: -2; width: 74%; height: auto; top: 14%; left: 37%; border: 1px solid #ffffff40; border-radius: 12px; transform: rotate(-7deg); box-shadow: 0 16px 42px #0008; }
    .dashboard::after { content: ""; position: absolute; z-index: -1; inset: 0; background: linear-gradient(90deg, #172033 1%, transparent 86%), linear-gradient(0deg, #172033 1%, transparent 80%); }
    .mobile { border: 1px solid var(--line); background: linear-gradient(145deg, white 6%, #dbeaff); }
    .mobile::before { content: ""; position: absolute; z-index: -2; inset: 0; background: radial-gradient(circle, #0879ff35 1px, transparent 1.5px) 0 0 / 14px 14px; mask-image: linear-gradient(225deg, black, transparent 65%); }
    .phone { position: absolute; z-index: -1; top: 16px; right: 27px; width: 76px; height: 120px; border: 2px solid #0879ff55; border-radius: 15px; background: #ffffff8c; transform: rotate(13deg); box-shadow: 8px 10px 0 #0879ff13; display: grid; place-items: center; }
    .phone::before { content: ""; position: absolute; top: 7px; width: 20px; height: 3px; border-radius: 8px; background: #0879ff55; }
    .phone::after { content: ""; width: 27px; height: 27px; border: 2px solid var(--blue); border-radius: 5px; background: linear-gradient(var(--blue), var(--blue)) center / 70% 2px no-repeat; }
    .feature-title { font-size: clamp(21px, 3vw, 29px); line-height: 1.3; font-weight: 600; }
    .feature p { margin: 6px 0 16px; color: #526b91; }
    .dashboard p { color: #dbeaff; }
    .action { display: inline-flex; gap: 10px; align-items: center; min-height: 36px; padding-inline: 12px; background: white; border-radius: 8px; color: #143b68; }
    .mobile .action { background: #065fd4; color: white; }
    .quick { margin-top: 32px; }
    .quick h2 { margin-bottom: 12px; font-size: 16px; font-weight: 400; }
    .quick-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .quick-grid a { display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .quick-grid a:hover { border-color: var(--blue); background: var(--pale); }
    .quick-grid span { color: #065fd4; }
    @media (max-width: 720px) {
      main { width: min(100% - 32px, 520px); }
      .featured { grid-template-columns: 1fr; margin-top: 22px; }
      .feature { min-height: 234px; padding: 20px; }
      .quick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .quick-grid a { padding-inline: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .feature { transition: none; }
      .feature:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1><span>合肥市</span>电气焊安全监管服务平台</h1>
    <nav class="featured" aria-label="主要入口">
      <a class="feature dashboard" href="./pages/index.html">
        <img src="./assets/guide/dashboard.png" alt="" width="1920" height="1080">
        <h2 class="feature-title">监管大屏</h2>
        <p>查看区域风险、预警趋势与处置情况</p>
        <span class="action" aria-hidden="true">打开大屏 <span>↗</span></span>
      </a>
      <a class="feature mobile" href="./pages/mini-workbench.html">
        <span class="phone" aria-hidden="true"></span>
        <h2 class="feature-title">焊工作业小程序</h2>
        <p>查看移动工作台与安装站点</p>
        <span class="action" aria-hidden="true">打开工作台 <span>↗</span></span>
      </a>
    </nav>
    <section class="quick" aria-labelledby="quick-title">
      <h2 id="quick-title">常用入口</h2>
      <nav class="quick-grid" aria-labelledby="quick-title">
        <a href="./device-management.html">设备管理<span aria-hidden="true">↗</span></a>
        <a href="./pages/enterprise-management.html">单位管理<span aria-hidden="true">↗</span></a>
        <a href="./pages/analytics.html">统计分析<span aria-hidden="true">↗</span></a>
        <a href="./pages/ledger.html">预警台账<span aria-hidden="true">↗</span></a>
        <a href="./pages/warning-rules.html">预警规则<span aria-hidden="true">↗</span></a>
        <a href="./pages/docs.html">功能说明<span aria-hidden="true">↗</span></a>
      </nav>
    </section>
  </main>
</body>
</html>
